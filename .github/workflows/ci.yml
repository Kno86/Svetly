name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_USER: svetly
          POSTGRES_PASSWORD: svetly_local_dev_only
          POSTGRES_DB: svetly_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U svetly -d svetly_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://svetly:svetly_local_dev_only@localhost:5432/svetly_test?schema=public
      AUTH_SECRET_FILE: /tmp/svetly-ci/auth-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build

  docker-smoke:
    runs-on: ubuntu-24.04
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait --wait-timeout 180
      - run: sh infra/scripts/smoke.sh
      - name: Restart keeps data
        run: |
          before=$(docker compose exec -T db psql -U svetly -d svetly -tAc "select value->>'id' from settings where key='instance'")
          docker compose restart
          docker compose up -d --wait --wait-timeout 120
          after=$(docker compose exec -T db psql -U svetly -d svetly -tAc "select value->>'id' from settings where key='instance'")
          test -n "$before" && test "$before" = "$after"
      - name: Backup and verified restore into an isolated project
        run: |
          bash infra/scripts/backup.sh
          bash infra/scripts/restore-test.sh "$(ls -t backups/*.dump | head -n1)"
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down
