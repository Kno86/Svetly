# Production overlay (not used locally):
#   docker compose -f compose.yaml -f compose.prod.yaml --env-file .env.production up -d --build
# Caddy terminates HTTPS for SVETLY_DOMAIN; web is no longer published directly.
services:
  db:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set for production}

  api:
    environment:
      SVETLY_ENV: production
      SVETLY_PUBLIC_URL: https://${SVETLY_DOMAIN:?SVETLY_DOMAIN must be set for production}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set for production}
      SMTP_URL: ${SMTP_URL:?SMTP_URL must be set for production (real SMTP, not Mailpit)}
      MAIL_FROM: ${MAIL_FROM:?MAIL_FROM must be set for production}

  # Mailpit is a local development tool only.
  mailpit:
    profiles: [local-only]

  web:
    ports: !reset []

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    environment:
      SVETLY_DOMAIN: ${SVETLY_DOMAIN:?SVETLY_DOMAIN must be set for production}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL must be set for production}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./infra/caddy/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [backend]
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
